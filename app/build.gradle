plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
}

android {
    compileSdk 35
    namespace "com.fz.badgeview.demo"
    defaultConfig {
        applicationId "com.fz.badgeview.demo"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation project(":lirary")
    implementation project(":annotation")
//    kapt(project(":compiler"))
    ksp(project(":ksp"))
//    implementation 'com.github.peihua8858.BadgeView:BadgeView:1.0.8'
//    kapt('com.github.peihua8858.BadgeView:compiler:1.0.8')
//    implementation 'com.github.peihua8858.BadgeView:annotation:1.0.8'
//    implementation 'com.fz.badgeview:annotation:1.0.0'
//    kapt 'com.github.peihua8858:compiler:1.0.0'
//    implementation 'com.github.peihua8858:annotation:1.0.0'
//    kapt 'com.fz.badgeview:compiler:1.0.1-SNAPSHOT'
    implementation 'com.github.peihua8858.ImageLoader:imageloader:1.0.8'
//    implementation 'com.github.bingoogolapple.BGABadgeView-Android:api:1.2.0'
//    kapt "com.github.bingoogolapple.BGABadgeView-Android:compiler:1.2.0"
}